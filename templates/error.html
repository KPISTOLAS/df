<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Σφάλμα {{ code }} - Node Network</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2c3e50;
    }
    .error-card {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 460px;
    }
    .error-code { font-size: 3rem; font-weight: bold; color: #c0392b; margin: 0; }
    .error-message { color: #555; margin: 14px 0 24px; }
    a.home {
      display: inline-block;
      padding: 10px 18px;
      background: #2c3e50;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
    a.home:hover { background: #1a252f; }
    a.home:focus-visible { outline: 3px solid #2980b9; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="error-card">
    <p class="error-code">{{ code }}</p>
    <p class="error-message">{{ message }}</p>
    <a class="home" href="{{ url_for('login') }}">Επιστροφή στην αρχική</a>
  </main>
</body>
</html>
